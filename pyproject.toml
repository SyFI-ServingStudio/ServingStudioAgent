[project]
name = "vibesim-user-facing-ui"
version = "0.1.0"
description = "Web chat UI that drives codex exec as the LLM backend for VibeSim"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "mcp>=1.13,<2",
    "uvicorn[standard]>=0.30",
]

# This is an app, not a library: don't try to build/install it as a package.
[tool.uv]
package = false
