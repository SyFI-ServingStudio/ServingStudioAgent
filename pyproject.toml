[project]
name = "vibesim-agent"
version = "0.1.0"
description = "VibeSim Agent service for durable workspaces, conversations, and provider execution"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28,<1",
    # Explicit startup renders role contracts through vibesim_agent.prompts.
    "jinja2>=3.1",
    "pyyaml>=6,<7",
    "jsonschema>=4.23,<5",
    "mcp>=1.13,<2",
    "uvicorn[standard]>=0.30",
]

# This is an app, not a library: don't try to build/install it as a package.
[tool.uv]
package = false
