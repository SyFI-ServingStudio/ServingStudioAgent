[project]
name = "vibesim-user-facing-ui"
version = "0.1.0"
description = "Web chat UI that drives codex exec as the LLM backend for VibeSim"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28,<1",
    # Runtime: backend/codex_runtime/config.py imports backend/agents_prompt.py,
    # which renders the gitignored files in backend/prompts/ from
    # backend/prompt_templates/.
    "jinja2>=3.1",
    "mcp>=1.13,<2",
    "uvicorn[standard]>=0.30",
]

# This is an app, not a library: don't try to build/install it as a package.
[tool.uv]
package = false
