version: 1

providers:
  gpt:
    adapter: codex
    label: Codex
    home: ~/.codex
    default_model: gpt-6-sol
    default_effort: high
    models:
      gpt-6-sol:
        efforts: [low, medium, high, xhigh, max, ultra]
      gpt-6-luna:
        efforts: [low, medium, high, xhigh, max]
      gpt-5.6-sol:
        efforts: [low, medium, high, xhigh, max, ultra]
      gpt-5.6-terra:
        efforts: [low, medium, high, xhigh, max, ultra]
      gpt-5.6-luna:
        efforts: [low, medium, high, xhigh, max]

  codexs:
    adapter: codex
    label: Codex Secondary
    home: ~/.codexs
    default_model: gpt-6-astra
    default_effort: high
    models:
      gpt-6-astra:
        efforts: [low, medium, high, xhigh, max, ultra]

  claude:
    adapter: claude
    label: Claude Gateway
    base_url: https://gateway.example.invalid
    environment:
      ANTHROPIC_AUTH_TOKEN: WORK_CLAUDE_TOKEN
    default_model: claude-sonnet-5
    default_effort: high
    models:
      claude-sonnet-5:
        efforts: [low, medium, high, xhigh, max]
      claude-opus-5-5:
        efforts: [low, medium, high, xhigh, max]
      claude-opus-5:
        efforts: [low, medium, high, xhigh, max]

  claudeme:
    adapter: claude
    label: Claude Personal
    home: ~/.claudeme
    default_model: claude-sonnet-5
    default_effort: high
    models:
      claude-sonnet-5:
        efforts: [low, medium, high, xhigh, max]
      claude-opus-5-5:
        efforts: [low, medium, high, xhigh, max]
      claude-opus-5:
        efforts: [low, medium, high, xhigh, max]

  claudek:
    adapter: claude
    label: Claude Compatible Gateway
    base_url: https://other.example.invalid
    environment:
      ANTHROPIC_AUTH_TOKEN: OTHER_CLAUDE_TOKEN
    default_model: glm-5.3-fp4
    default_effort: high
    models:
      glm-5.3-fp4:
        efforts: [low, medium, high, xhigh, max]

defaults:
  orchestrator: gpt
  implementer: gpt
  assistant: gpt
